<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reylyn General Merchandise — Bagumbong</title>
<style>
  :root{
    --yellow:#f8d524;
    --ink:#1c1a12;
    --paper:#fffdf5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(248,213,36,.14), transparent 55%),
      radial-gradient(circle at 82% 85%, rgba(248,213,36,.10), transparent 55%),
      var(--ink);
    background-size: 200% 200%;
    animation: drift 18s ease-in-out infinite;
  }

  @keyframes drift{
    0%,100%{ background-position: 0% 0%, 100% 100%, 0 0; }
    50%{ background-position: 15% 10%, 85% 90%, 0 0; }
  }

  .grid-overlay{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(248,213,36,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(248,213,36,.05) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image: radial-gradient(circle at 50% 45%, black 0%, transparent 75%);
  }

  main{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:38px; padding:32px;
  }

  .mark{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    text-align:center;
  }
  .mark img{
    height:120px; width:auto;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));
  }
  .mark strong{
    font-size:1.4rem; letter-spacing:.3px; color:var(--paper);
  }
  .mark span{
    font-size:.85rem; color:#d8d2b8;
  }

  .links{
    display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
  }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:14px 24px; border:2px solid var(--yellow); border-radius:2px;
    font-weight:700; font-size:.95rem;
    background:var(--yellow); color:var(--ink);
    transition:transform .15s ease, background .15s ease;
  }
  .btn.alt{background:transparent; color:var(--yellow);}
  .btn:hover{transform:translateY(-3px);}
  .btn svg{width:18px; height:18px; flex:none;}

  @media (prefers-reduced-motion: reduce){
    .btn:hover{transform:none;}
    body{animation:none;}
  }
</style>
</head>
<body>

<div class="grid-overlay"></div>

<main>
  <div class="mark">
    <img src="logo.png" alt="Reylyn General Merchandise logo">
    <strong>Reylyn General Merchandise</strong>
    <span>Bagumbong</span>
  </div>

  <div class="links">
    <a class="btn" href="https://facebook.com/reylyngeneralmerchandisebagumbong" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z"/></svg>
      Facebook
    </a>
    <a class="btn alt" href="tel:09228315440">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
      0922 831 5440
    </a>
    <a class="btn alt" href="https://maps.app.goo.gl/LTXYZr5g3cFrYFZ59" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      Google Maps
    </a>
  </div>
</main>

</body>
</html>
